# Deploys main to AWS: lint, test and build every package, then `cdk deploy` via GitHub OIDC.
# Packages without a package.json are skipped; the deploy is skipped until infra/package.json exists.
# Requires the repository secret AWS_ROLE_ARN and a one-time `cdk bootstrap` of the target account.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false # never interrupt a running deployment

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Order matters: infra/ may package the backend and frontend build output.
      - name: Lint, test and build
        run: |
          for dir in app/backend app/frontend infra; do
            if [ ! -f "$dir/package.json" ]; then
              echo "::notice::No $dir/package.json yet - skipped."
              continue
            fi
            echo "::group::$dir"
            npm ci --prefix "$dir"
            npm run lint --if-present --prefix "$dir"
            npm test --if-present --prefix "$dir"
            npm run build --if-present --prefix "$dir"
            echo "::endgroup::"
          done

      - name: Configure AWS credentials (OIDC)
        if: hashFiles('infra/package.json') != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: CDK deploy
        if: hashFiles('infra/package.json') != ''
        working-directory: infra
        run: npx cdk deploy --all --require-approval never
