# Pull request checks: lint, test and build every package, then synthesize the CDK app.
# Packages without a package.json are skipped. Never touches AWS.
name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Order matters: infra/ may package the backend and frontend build output.
      - name: Lint, test and build
        run: |
          for dir in app/backend app/frontend infra; do
            if [ ! -f "$dir/package.json" ]; then
              echo "::notice::No $dir/package.json yet - skipped."
              continue
            fi
            echo "::group::$dir"
            npm ci --prefix "$dir"
            npm run lint --if-present --prefix "$dir"
            npm test --if-present --prefix "$dir"
            npm run build --if-present --prefix "$dir"
            echo "::endgroup::"
          done

      - name: CDK synth
        if: hashFiles('infra/package.json') != ''
        working-directory: infra
        run: npx cdk synth --quiet
